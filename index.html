<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium developer portfolio featuring engineering work, AI/LLM systems, and technical thought leadership.">
    <meta name="author" content="Your Name">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Developer Portfolio">
    <meta property="og:description" content="Software Engineer · AI Engineer · Builder">
    <meta property="og:image" content="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Developer Portfolio">
    <meta name="twitter:description" content="Software Engineer · AI Engineer · Builder">
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80">
    
    <title>Developer Portfolio</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <div id="app" class="app">
        <!-- Loading state -->
        <div id="loading" class="loading-state">
            <div class="loading-container">
                <p>Loading portfolio...</p>
            </div>
        </div>

        <!-- Error state -->
        <div id="error" class="error-state" style="display: none;">
            <div class="error-container">
                <h2>Unable to load portfolio</h2>
                <p>Please check <code>config.json</code> and ensure it's valid JSON.</p>
                <p id="error-message"></p>
            </div>
        </div>

        <!-- Main content (hidden until loaded) -->
        <div id="content" style="display: none;">
            <div class="page">
                <!-- Left sidebar profile -->
                <aside class="profile-sidebar">
                    <div class="profile-container">
                        <!-- Profile image -->
                        <div class="profile-image-wrapper">
                            <img id="profile-image" src="" alt="" class="profile-image">
                        </div>

                        <!-- Profile info -->
                        <h1 id="profile-name" class="profile-name"></h1>
                        <p id="profile-title" class="profile-title"></p>

                        <!-- Social links -->
                        <nav class="social-links" id="social-links">
                            <!-- Generated by JavaScript -->
                        </nav>

                        <!-- About section -->
                        <section class="about-section">
                            <h2 class="about-headline" id="about-headline"></h2>
                            <p class="about-description" id="about-description"></p>
                            
                            <div class="about-meta">
                                <div id="focus-areas" class="focus-areas"></div>
                                <div id="about-footer" class="about-footer"></div>
                            </div>
                        </section>
                    </div>
                </aside>

                <!-- Right content area -->
                <main class="content-main">
                    <!-- Navigation -->
                    <nav class="section-navigation" id="section-navigation">
                        <!-- Generated by JavaScript -->
                    </nav>

                    <!-- Content sections container -->
                    <div class="sections-container">
                        <!-- Professional Journey Section -->
                        <section id="section-journey" class="content-section" data-section="journey">
                            <div class="section-header">
                                <h2>Professional Journey</h2>
                            </div>
                            <div id="journey-content" class="section-content">
                                <!-- Generated by JavaScript -->
                            </div>
                        </section>

                        <!-- Thought Leadership Section -->
                        <section id="section-thought-leadership" class="content-section" data-section="thought-leadership">
                            <div class="section-header">
                                <h2>Thought Leadership</h2>
                            </div>
                            <div id="thought-leadership-content" class="section-content">
                                <!-- Generated by JavaScript -->
                            </div>
                        </section>

                        <!-- Innovations Section -->
                        <section id="section-innovations" class="content-section" data-section="innovations">
                            <div class="section-header">
                                <h2>Innovations</h2>
                            </div>
                            <div id="innovations-content" class="section-content">
                                <!-- Generated by JavaScript -->
                            </div>
                        </section>

                        <!-- Personal Building Section -->
                        <section id="section-building" class="content-section" data-section="building">
                            <div class="section-header">
                                <h2>Personal Building</h2>
                            </div>
                            <div id="building-content" class="section-content">
                                <!-- Generated by JavaScript -->
                            </div>
                        </section>
                    </div>
                </main>
            </div>

            <!-- Footer -->
            <footer class="footer">
                <div class="footer-content">
                    <p id="footer-text"></p>
                    <p id="footer-source"></p>
                </div>
            </footer>
        </div>
    </div>

    <!-- Scripts -->
    <script src="./js/config.js"></script>
    <script src="./js/components.js"></script>
    <script src="./js/navigation.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
