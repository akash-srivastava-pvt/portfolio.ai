<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      :root { color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0a0a0a; }
        .fg { fill: #4d8fff; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .fg { fill: #0066cc; }
      }
    </style>
  </defs>
  <!-- Background -->
  <rect class="bg" width="100" height="100"/>
  <!-- Bracket shape representing code/development -->
  <path class="fg" d="M 30 25 L 25 25 L 25 75 L 30 75" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <path class="fg" d="M 70 25 L 75 25 L 75 75 L 70 75" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle class="fg" cx="50" cy="50" r="4"/>
</svg>
